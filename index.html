<!DOCTYPE html>
<html lang='en'>
  <head>
    <meta charset='UTF-8'/>
    <title>Sign-up</title>
    <link rel='stylesheet' href='style.css'/>
  </head>
  <body>
     <div class="content">
      <div class="left-content">
  <div class="title-bar">
    <img alt="Odin project's logo." src="./img/odin-lined.png">
    <h1>Odin</h1>
  </div>
  <img class="main-img" alt="Bridge placed beside a rocky valley by the ocean."
    src="./img/aliaksei-lepik-z6jeX5-_azE-unsplash.jpg">
  <div class="credit">
    Photo by <a href="https://unsplash.com/@vegfrt?utm_source=unsplash&utm_
medium=referral&utm_content=creditCopyText">Aliaksei Lepik</a> on 
    <a href="https://unsplash.com/photos/bixby-creek-bridge-in-california-
z6jeX5-_azE?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText"
>Unsplash</a>
  </div>
</div>
    <div class="right-content">
        <div class="intro">
          <p>Hey there! Welcome to my sign-up page. Feel free to fill out these
          forms and watch as they validate your inputs.
          </p> 
          <p>Lovely ay?</p>
        </div>
      <div class="form">
    <form action="" method="post">
      <h2>Let's do this!</h2>
      <fieldset>
        <label for="fname">FIRST NAME</label>
        <input type="text" id="fname" name="fname">

        <label for="lname">LAST NAME</label>
        <input type="text" id="lname" name="lname">

        <label for="email">EMAIL</label>
        <input type="email" id="email" name="email">

        <label for="number">PHONE NUMBER</label>
        <input type="tel" id="number" name="number">

        <label for="password">PASSWORD</label>
        <input type="password" id="password" name="password">

        <label for="password2">CONFIRM PASSWORD</label>
        <input type="password" id="password2" name="password2">
      </fieldset>

      <button type="submit">Create Account</button>
      <p class="login-link">Already have an account? <a href="">Log in</a></p>
    </form>
  </div>
</div>

     
</div>



    
    
  </body>
</html>
